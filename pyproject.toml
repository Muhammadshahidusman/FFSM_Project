[project]
name = "ffsm"
version = "0.1.0"
description = "Flash flood susceptibility in the urban wadis of Makkah (Sentinel-1 inventory, stacking ensemble, SHAP)"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy>=1.26,<2.0",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "lightgbm>=4.3",
    "catboost>=1.2",
    "shap>=0.45",
    "rasterio>=1.3",
    "geopandas>=0.14",
    "shapely>=2.0",
    "fiona>=1.9",
    "pyproj>=3.6",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "joblib>=1.3",
    "pyyaml>=6.0",
    "scipy>=1.11",
    "tqdm>=4.66",
]

[tool.uv]
package = false          # scripts project, nothing to install
dev-dependencies = [
    "jupyter>=1.0",
    "ipykernel>=6.29",
]
